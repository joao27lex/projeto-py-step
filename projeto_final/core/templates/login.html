{% extends 'base.html' %}

{% block title %}Login - Área do Condômino{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <!-- Card de Login -->
    <div class="max-w-md w-full bg-white p-8 rounded-xl shadow-sm border border-slate-200 space-y-8">
        
        <!-- Cabeçalho -->
        <div class="text-center">
            <div class="inline-flex items-center justify-center h-12 w-12 rounded-full bg-indigo-50 mb-4">
                <svg class="h-6 w-6 text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.071 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0015.171 17m3.839 1.132c.645-2.266.99-4.659.99-7.132A8 8 0 008 4.07M3 15.364c.64-1.319 1-2.8 1-4.364 0-1.457.39-2.823 1.07-4" />
                </svg>
            </div>
            <h2 class="text-2xl font-bold text-slate-800">Acesse sua conta</h2>
            <p class="mt-2 text-sm text-slate-500">Bem-vindo(a)! Insira suas credenciais.</p>
        </div>

        <!-- Formulário -->
        <form method="post" class="space-y-6">
            {% csrf_token %}
            
            <div class="space-y-4">
                <!-- Input de Usuário -->
                <div>
                    <label for="username" class="block text-sm font-medium text-slate-700 mb-1">Usuário</label>
                    <input type="text" name="username" id="username" placeholder="Seu nome de usuário" required 
                           class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-colors bg-white text-slate-800">
                </div>
                
                <!-- Input de Senha -->
                <div>
                    <label for="password" class="block text-sm font-medium text-slate-700 mb-1">Senha</label>
                    <input type="password" name="password" id="password" placeholder="••••••••" required 
                           class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-colors bg-white text-slate-800">
                </div>
            </div>

            <!-- Alerta de Erro -->
            {% if erro %}
                <div class="flex items-center gap-3 p-4 text-sm text-rose-600 bg-rose-50 border border-rose-200 rounded-lg">
                    <svg class="h-5 w-5 shrink-0" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
                    </svg>
                    <span>{{ erro }}</span>
                </div>
            {% endif %}

            <!-- Botão de Submit -->
            <button type="submit" class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors cursor-pointer">
                Entrar
            </button>
        </form>
    </div>
</div>
{% endblock %}
